<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counterpick — пять концепций</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 2200px;
        min-height: 1100px;
        margin: 0;
        color: #e9e7df;
        background: #0c0f0d;
        font-family: Arial, sans-serif;
      }

      body {
        padding: 30px 34px 34px;
        background:
          radial-gradient(circle at 50% -30%, rgba(121, 131, 123, 0.17), transparent 48%),
          #0c0f0d;
      }

      header {
        display: flex;
        height: 96px;
        align-items: flex-start;
        justify-content: space-between;
        border-bottom: 1px solid #303531;
      }

      h1 {
        margin: 0;
        font-size: 42px;
        line-height: 0.95;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      header p {
        margin: 4px 0 0;
        color: #8d938e;
        font-family: monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      main {
        display: grid;
        grid-template-columns: repeat(5, 390px);
        justify-content: space-between;
        gap: 22px;
        padding-top: 22px;
      }

      figure {
        margin: 0;
      }

      img {
        display: block;
        width: 390px;
        height: 844px;
        object-fit: cover;
        border: 1px solid #343a36;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
      }

      figcaption {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding-top: 11px;
      }

      figcaption strong {
        font-size: 15px;
        text-transform: uppercase;
      }

      figcaption span {
        color: #8d938e;
        font-family: monospace;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Counterpick / Home 2026</h1>
        <p>ПЯТЬ САМОСТОЯТЕЛЬНЫХ АРТ-ДИРЕКЦИЙ · ОДИН СЦЕНАРИЙ · 390 × 844</p>
      </div>
      <p>DESIGN ROUND 01 · 23 JUL 2026</p>
    </header>
    <main>
      <figure>
        <img src="output/playwright/concept-01-war-room.png" alt="Draft War Room" />
        <figcaption><strong>01 / Draft War Room</strong><span>TACTICAL</span></figcaption>
      </figure>
      <figure>
        <img src="output/playwright/concept-02-broadcast.png" alt="TI Broadcast" />
        <figcaption><strong>02 / TI Broadcast</strong><span>EDITORIAL</span></figcaption>
      </figure>
      <figure>
        <img src="output/playwright/concept-03-notebook.png" alt="Coach Notebook" />
        <figcaption><strong>03 / Coach Notebook</strong><span>HUMAN</span></figcaption>
      </figure>
      <figure>
        <img src="output/playwright/concept-04-relic.png" alt="Ancient Relic" />
        <figcaption><strong>04 / Ancient Relic</strong><span>IMMERSIVE</span></figcaption>
      </figure>
      <figure>
        <img src="output/playwright/concept-05-kinetic.png" alt="Kinetic Arena" />
        <figcaption><strong>05 / Kinetic Arena</strong><span>EXPRESSIVE</span></figcaption>
      </figure>
    </main>
  </body>
</html>
