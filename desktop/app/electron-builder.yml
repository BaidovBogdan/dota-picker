appId: com.counterpick.desktop
productName: Counterpick
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: ../../client/assets/brand/counterpick-icon.png
    to: brand/counterpick-icon.png
asar: true
asarUnpack:
  - node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node
electronLanguages:
  - en-US
  - ru
publish:
  provider: github
  owner: BaidovBogdan
  repo: counterpick-releases
  private: false
win:
  executableName: Counterpick
  icon: ../../client/assets/brand/counterpick-icon.png
  target:
    - nsis
  artifactName: Counterpick-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: installer/installer.nsh
  installerLanguages:
    - en_US
    - ru_RU
mac:
  target:
    - dmg
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  category: Utility
